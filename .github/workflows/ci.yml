name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install nbformat

    - name: Validate Notebook Syntax & Integrity
      run: |
        python -c "
        import glob, json, nbformat
        for nb in sorted(glob.glob('notebooks/*.ipynb')):
            print(f'Validating {nb}...')
            with open(nb, 'r', encoding='utf-8') as f:
                node = nbformat.read(f, as_version=4)
                nbformat.validate(node)
        print('All notebooks passed structural validation!')
        "
